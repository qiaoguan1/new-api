location ^~ /internal-upstreams/banana/ {
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 156.239.3.210;
    deny all;

    proxy_pass http://xtai-banana-chat-adapter:8093/;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;
    proxy_request_buffering on;
    proxy_buffering off;
}
